services:
  backend:
  
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: findmy-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - findmy-session:/root/.findmy-session.json
      - findmy-cookies:/root/.findmy-cookies
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: findmy-frontend-dev
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  findmy-session:
  findmy-cookies:
