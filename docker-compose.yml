x-shared: &shared
  restart: unless-stopped
  networks:
    - findmy-net

services:
  backend:
    <<: *shared
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findmy-backend
    ports:
      - "8000:8000"
    volumes:
      - findmy-data:/root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    <<: *shared
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: findmy-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  findmy-data:

networks:
  findmy-net:
    driver: bridge
